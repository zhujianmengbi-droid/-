name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6==6.11.1 psutil==7.2.2 PyInstaller==6.21.0

      - name: Extract source archive
        shell: pwsh
        run: Expand-Archive -LiteralPath "source/ZJ-HUB-v1.3-source.zip" -DestinationPath "build-source" -Force

      - name: Install application dependencies
        run: python -m pip install --upgrade -r build-source/requirements.txt

      - name: Build Windows executable
        working-directory: build-source
        run: python build_large.py

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $tag = "v1.3"
          $asset = "build-source/dist/ZJ HUB.exe"
          $downloadAsset = "build-source/ZJ-HUB-v1.3.exe"
          $sourceAsset = "build-source/ZJ-HUB-v1.3-source.zip"
          $checksumAsset = "build-source/ZJ-HUB-v1.3-SHA256.txt"
          if (!(Test-Path -LiteralPath $asset)) { throw "Build output not found: $asset" }
          Copy-Item -LiteralPath $asset -Destination $downloadAsset -Force
          Copy-Item -LiteralPath "source/ZJ-HUB-v1.3-source.zip" -Destination $sourceAsset -Force
          $exeHash = (Get-FileHash -LiteralPath $downloadAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash -LiteralPath $sourceAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "ZJ-HUB-v1.3.exe"
            "SHA256: $exeHash"
            ""
            "ZJ-HUB-v1.3-source.zip"
            "SHA256: $sourceHash"
          ) | Set-Content -LiteralPath $checksumAsset -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $downloadAsset $sourceAsset $checksumAsset --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --notes-file "release-notes/1.3.txt" --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $downloadAsset $sourceAsset $checksumAsset --title "ZJ HUB $tag" --notes-file "release-notes/1.3.txt" --latest --repo $env:GITHUB_REPOSITORY
          }






