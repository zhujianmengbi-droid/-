name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6==6.11.1 psutil==7.2.2 PyInstaller==6.21.0

      - name: Install application dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build Windows executable
        run: python build_large.py

      - name: Package reproducible source archive
        run: python package_source.py

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $version = (python package_source.py --version).Trim()
          $tag = "v$version"
          $asset = "dist/ZJ HUB.exe"
          $downloadAsset = "ZJ-HUB-v$version.exe"
          $sourceAsset = "dist/ZJ-HUB-v$version-source.zip"
          $checksumAsset = "ZJ-HUB-v$version-SHA256.txt"
          if (!(Test-Path -LiteralPath $asset)) { throw "Build output not found: $asset" }
          Copy-Item -LiteralPath $asset -Destination $downloadAsset -Force
          if (!(Test-Path -LiteralPath $sourceAsset)) { throw "Source archive not found: $sourceAsset" }
          $exeHash = (Get-FileHash -LiteralPath $downloadAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash -LiteralPath $sourceAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "ZJ-HUB-v$version.exe"
            "SHA256: $exeHash"
            ""
            "ZJ-HUB-v$version-source.zip"
            "SHA256: $sourceHash"
          ) | Set-Content -LiteralPath $checksumAsset -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $downloadAsset $sourceAsset $checksumAsset --clobber --repo $env:GITHUB_REPOSITORY
            $notes = "release-notes/$version.txt"
            if (Test-Path -LiteralPath $notes) { gh release edit $tag --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY }
          } else {
            $notes = "release-notes/$version.txt"
            if (Test-Path -LiteralPath $notes) { gh release create $tag $downloadAsset $sourceAsset $checksumAsset --title "ZJ HUB $tag" --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY }
            else { gh release create $tag $downloadAsset $sourceAsset $checksumAsset --title "ZJ HUB $tag" --notes "ZJ HUB $tag" --latest --repo $env:GITHUB_REPOSITORY }
          }






