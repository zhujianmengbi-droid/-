name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build steps only need to read the repository. The release job below is the
# only job that receives contents:write, and GH_TOKEN is scoped to its final
# publishing step rather than being present during dependency installation or
# application builds.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --upgrade pip PySide6==6.11.1 psutil==7.2.2 PyInstaller==6.21.0

      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --upgrade -r requirements.txt

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Build Windows executable
        run: python build_large.py

      - name: Package reproducible source archive
        run: python package_source.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zj-hub-release-assets
          if-no-files-found: error
          path: dist
          retention-days: 7

  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python for version extraction
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zj-hub-release-assets
          path: dist

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          # Keep the write-capable token out of checkout, setup, and build
          # steps. Only the gh command below can read it.
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python package_source.py --version
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version." }
          $version = ([string]$version).Trim()
          if (!$version) { throw "The application version is empty." }
          $tag = "v$version"
          $asset = "dist/ZJ HUB.exe"
          $downloadAsset = "ZJ-HUB-v$version.exe"
          $sourceAsset = "dist/ZJ-HUB-v$version-source.zip"
          $modpackAsset = "companions/ZJ-HUB-modpack.zip"
          $checksumAsset = "ZJ-HUB-v$version-SHA256.txt"
          if (!(Test-Path -LiteralPath $asset)) { throw "Build output not found: $asset" }
          Copy-Item -LiteralPath $asset -Destination $downloadAsset -Force
          if (!(Test-Path -LiteralPath $sourceAsset)) { throw "Source archive not found: $sourceAsset" }
          if (!(Test-Path -LiteralPath $modpackAsset -PathType Leaf)) { throw "Companion modpack not found: $modpackAsset" }
          $exeHash = (Get-FileHash -LiteralPath $downloadAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash -LiteralPath $sourceAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $modpackHash = (Get-FileHash -LiteralPath $modpackAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "ZJ-HUB-v$version.exe"
            "SHA256: $exeHash"
            ""
            "ZJ-HUB-v$version-source.zip"
            "SHA256: $sourceHash"
            ""
            "ZJ-HUB-modpack.zip"
            "SHA256: $modpackHash"
          ) | Set-Content -LiteralPath $checksumAsset -Encoding utf8
          $releaseAssets = @($downloadAsset, $sourceAsset, $modpackAsset, $checksumAsset)
          $notes = "release-notes/$version.txt"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @releaseAssets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets for $tag." }
            if (Test-Path -LiteralPath $notes) {
              gh release edit $tag --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY
            } else {
              gh release edit $tag --latest --repo $env:GITHUB_REPOSITORY
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata for $tag." }
          } else {
            if (!$env:GITHUB_SHA) { throw "The source commit for this build is missing." }
            if (Test-Path -LiteralPath $notes) {
              gh release create $tag @releaseAssets --target $env:GITHUB_SHA --title "ZJ HUB $tag" --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY
            } else {
              gh release create $tag @releaseAssets --target $env:GITHUB_SHA --title "ZJ HUB $tag" --notes "ZJ HUB $tag" --latest --repo $env:GITHUB_REPOSITORY
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
          }
