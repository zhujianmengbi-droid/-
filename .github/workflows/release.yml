name: Build Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a new version (fails if its tag or release already exists)"
        required: true
        type: boolean
        default: false

# Build steps only need to read the repository. The release job below is the
# only job that receives contents:write, and GH_TOKEN is scoped to its final
# publishing step rather than being present during dependency installation or
# application builds.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Could not update pip." }
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned build dependencies." }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Build Windows executable
        run: python build_large.py

      - name: Package reproducible source archive
        run: python package_source.py

      - name: Check the packaged executable with isolated settings
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'dist/ZJ HUB.exe'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/ZJ-HUB-new-pc-check.json'
          $process = Start-Process -FilePath $executable -ArgumentList @('--check-new-pc', ('"{0}"' -f $report)) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged startup check failed with exit code $($process.ExitCode)." }
          if (!(Test-Path -LiteralPath $report -PathType Leaf)) { throw "Packaged startup check did not write its report." }
          $result = Get-Content -LiteralPath $report -Raw -Encoding utf8 | ConvertFrom-Json
          $checks = @($result.checks.PSObject.Properties)
          $failures = @($checks | Where-Object { $_.Value -ne $true })
          if ($result.ok -ne $true -or $checks.Count -lt 16 -or $failures.Count -gt 0) {
            throw "Packaged startup check failed or is incomplete. Inspect ZJ-HUB-new-pc-check.json."
          }
          Write-Host "Packaged executable passed $($checks.Count) isolated startup checks."

      - name: Upload startup diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zj-hub-startup-diagnostic
          if-no-files-found: warn
          path: dist/ZJ-HUB-new-pc-check.json
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zj-hub-release-assets
          if-no-files-found: error
          path: dist
          retention-days: 7

  release:
    # A normal source push must never replace a locally verified release.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: zj-hub-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python for version extraction
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zj-hub-release-assets
          path: dist

      - name: Publish a new GitHub Release without replacing assets
        shell: pwsh
        env:
          # Keep the write-capable token out of checkout, setup, and build
          # steps. Only the gh command below can read it.
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python package_source.py --version
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version." }
          $version = ([string]$version).Trim()
          if (!$version) { throw "The application version is empty." }
          $tag = "v$version"
          $refsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing release tags; publication stopped." }
          $existingTag = @($refsJson | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$tag" })
          if ($existingTag.Count -gt 0) { throw "$tag already exists. Choose a new APP_VERSION; existing tags and assets are never replaced." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release for $tag already exists. Choose a new APP_VERSION; existing releases are never replaced." }
          $asset = "dist/ZJ HUB.exe"
          $downloadAsset = "ZJ-HUB-v$version.exe"
          $sourceAsset = "dist/ZJ-HUB-v$version-source.zip"
          $modpackAsset = "companions/ZJ-HUB-modpack.zip"
          $checksumAsset = "ZJ-HUB-v$version-SHA256.txt"
          if (!(Test-Path -LiteralPath $asset)) { throw "Build output not found: $asset" }
          Copy-Item -LiteralPath $asset -Destination $downloadAsset -Force
          if (!(Test-Path -LiteralPath $sourceAsset)) { throw "Source archive not found: $sourceAsset" }
          if (!(Test-Path -LiteralPath $modpackAsset -PathType Leaf)) { throw "Companion modpack not found: $modpackAsset" }
          $exeHash = (Get-FileHash -LiteralPath $downloadAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash -LiteralPath $sourceAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $modpackHash = (Get-FileHash -LiteralPath $modpackAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "ZJ-HUB-v$version.exe"
            "SHA256: $exeHash"
            ""
            "ZJ-HUB-v$version-source.zip"
            "SHA256: $sourceHash"
            ""
            "ZJ-HUB-modpack.zip"
            "SHA256: $modpackHash"
          ) | Set-Content -LiteralPath $checksumAsset -Encoding utf8
          $releaseAssets = @($downloadAsset, $sourceAsset, $modpackAsset, $checksumAsset)
          $notes = "release-notes/$version.txt"
          if (!$env:GITHUB_SHA) { throw "The source commit for this build is missing." }
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            gh release create $tag @releaseAssets --target $env:GITHUB_SHA --title "ZJ HUB $tag" --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @releaseAssets --target $env:GITHUB_SHA --title "ZJ HUB $tag" --notes "ZJ HUB $tag" --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag. No existing release assets were replaced." }
